<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ohanaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Ring Halo Gradient -->
    <linearGradient id="ohanaHaloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="80%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Head Helmet Gradient -->
    <linearGradient id="ohanaHelmetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Visor Face Gradient (Deep Navy) -->
    <linearGradient id="ohanaVisorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#0B1F3A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Headphone Ear Cup Blue Gradient -->
    <linearGradient id="ohanaBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Chat Bubble Gradient (Blue to Magenta/Pink) -->
    <linearGradient id="ohanaBubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="75%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Shield Gradient (Navy / Royal Blue) -->
    <linearGradient id="ohanaShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0B1F3A"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="ohanaEyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ohanaDropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B1F3A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Clean Canvas -->
  <g filter="url(#ohanaDropShadow)">
    <!-- Outer Halo Ring -->
    <ellipse cx="256" cy="275" rx="195" ry="180" fill="none" stroke="url(#ohanaHaloGrad)" stroke-width="14" opacity="0.85"/>

    <!-- Antenna Mast & Sphere -->
    <path d="M256 122 L256 78" stroke="#3B82F6" stroke-width="12" stroke-linecap="round"/>
    <circle cx="256" cy="68" r="22" fill="url(#ohanaBlueGrad)"/>
    <circle cx="250" cy="62" r="7" fill="#BAE6FD" opacity="0.8"/>

    <!-- Neck/Chest Support Base -->
    <path d="M192 370 Q256 425 320 370 Q305 440 256 440 Q207 440 192 370 Z" fill="#E2E8F0"/>

    <!-- Left & Right Headphone Bands / Outer Arc -->
    <path d="M125 240 C120 160 180 105 256 105 C332 105 392 160 387 240" fill="none" stroke="#E2E8F0" stroke-width="18" stroke-linecap="round"/>

    <!-- Outer Head Shell (Ceramic White) -->
    <ellipse cx="256" cy="245" rx="142" ry="118" fill="url(#ohanaHelmetGrad)"/>

    <!-- Dark High-Gloss Visor Screen -->
    <rect x="156" y="165" width="200" height="150" rx="60" fill="url(#ohanaVisorGrad)"/>
    <rect x="159" y="168" width="194" height="144" rx="57" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>

    <!-- Glowing Cyan Smiling Eyes (Happy Arc Shape ^ ^) -->
    <path d="M192 232 C192 210 226 210 226 232" fill="none" stroke="#38BDF8" stroke-width="13" stroke-linecap="round" filter="url(#ohanaEyeGlow)"/>
    <path d="M286 232 C286 210 320 210 320 232" fill="none" stroke="#38BDF8" stroke-width="13" stroke-linecap="round" filter="url(#ohanaEyeGlow)"/>

    <!-- Left Headphone Ear Cup -->
    <g transform="translate(100, 240)">
      <ellipse cx="0" cy="0" rx="24" ry="44" fill="#CBD5E1"/>
      <ellipse cx="-4" cy="0" rx="18" ry="38" fill="url(#ohanaBlueGrad)"/>
      <ellipse cx="-7" cy="-6" rx="6" ry="16" fill="#93C5FD" opacity="0.7"/>
    </g>

    <!-- Right Headphone Ear Cup -->
    <g transform="translate(412, 240)">
      <ellipse cx="0" cy="0" rx="24" ry="44" fill="#CBD5E1"/>
      <ellipse cx="4" cy="0" rx="18" ry="38" fill="url(#ohanaBlueGrad)"/>
      <ellipse cx="7" cy="-6" rx="6" ry="16" fill="#93C5FD" opacity="0.7"/>
    </g>

    <!-- Top-Right Chat Speech Bubble with 3 Dots -->
    <g transform="translate(345, 125)">
      <path d="M0 45 C0 15 25 0 65 0 C105 0 130 15 130 45 C130 75 105 90 65 90 C50 90 38 94 22 104 C25 94 25 87 20 83 C8 75 0 62 0 45 Z" fill="url(#ohanaBubbleGrad)"/>
      <!-- Three White Dots -->
      <circle cx="45" cy="45" r="7.5" fill="#FFFFFF"/>
      <circle cx="68" cy="45" r="7.5" fill="#FFFFFF"/>
      <circle cx="91" cy="45" r="7.5" fill="#FFFFFF"/>
    </g>

    <!-- Bottom-Right Security Shield with Lock -->
    <g transform="translate(290, 265)">
      <!-- Shield Body -->
      <path d="M50 0 L95 18 C95 62 65 98 50 110 C35 98 5 62 5 18 Z" fill="url(#ohanaShieldGrad)" stroke="#FFFFFF" stroke-width="4.5"/>
      <!-- White Lock Detail inside Shield -->
      <rect x="36" y="52" width="28" height="24" rx="4" fill="#FFFFFF"/>
      <path d="M42 52 L42 42 C42 37 45 33 50 33 C55 33 58 37 58 42 L58 52" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="50" cy="62" r="3" fill="#1D4ED8"/>
      <path d="M50 64 L50 70" stroke="#1D4ED8" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
